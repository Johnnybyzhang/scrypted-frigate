name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install --global npm@12.0.2

      - name: Match the tag to package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must contain a stable semantic version, got $package_version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify the package
        run: npm run verify

      - name: Create a unique staged version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must contain a stable semantic version, got $package_version" >&2
            exit 1
          fi

          stage_base="$package_version"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            stage_base="$(node -e "process.stdout.write(require('semver').inc(process.argv[1], 'patch'))" "$package_version")"
          fi

          short_sha="${GITHUB_SHA:0:12}"
          stage_version="$stage_base-dev.$GITHUB_RUN_NUMBER.$short_sha"
          npm version "$stage_version" --no-git-tag-version
          echo "Staging $package_name@$stage_version"

      - name: Stage the commit build
        if: github.ref == 'refs/heads/main'
        run: npm stage publish . --access public --tag dev --loglevel verbose

      - name: Publish the tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public
